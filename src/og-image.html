<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OxidePM social preview</title>
<!-- Rendered to /og-image.png (1200x630) with a headless browser; see README.md. Not part of the site. -->
<style>
@font-face { font-family: "Barlow Condensed"; font-weight: 600; src: url("../assets/fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow Condensed"; font-weight: 400; src: url("../assets/fonts/barlow-condensed-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Barlow"; font-weight: 400; src: url("../assets/fonts/barlow-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url("../assets/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }
:root {
  --bg: #f2f2f3; --text: #1d1f20; --ink-2: #4c4e4f; --divider: #cfd0d1; --accent: #416180;
  --term-bg: #1d2d3d; --term-fg: #e7e7ea; --term-dim: #9fb0c2; --term-hi: #b5d9fd; --term-ox: #f0a46e; --term-rule: #3a4a5a;
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); color: var(--text); }
body { font-family: "Barlow", sans-serif; position: relative; }
.frame { position: absolute; inset: 22px; border: 1px solid var(--divider); }
.corner { position: absolute; width: 13px; height: 13px; color: #75777a; }
.corner::before, .corner::after { content: ""; position: absolute; background: currentColor; }
.corner::before { left: 6px; top: 0; width: 1px; height: 100%; }
.corner::after { top: 6px; left: 0; width: 100%; height: 1px; }
.tl { top: -7px; left: -7px; } .tr { top: -7px; right: -7px; } .bl { bottom: -7px; left: -7px; } .br { bottom: -7px; right: -7px; }
.content { position: absolute; inset: 22px; padding: 50px 52px 0; }
.top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-word { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 40px; line-height: 1; letter-spacing: 0.01em; }
.brand-word span { font-weight: 400; color: var(--ink-2); }
.url { font-family: "JetBrains Mono", monospace; font-size: 20px; color: var(--ink-2); }
h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase; font-size: 74px; line-height: 1; letter-spacing: 0.005em; margin: 44px 0 0; white-space: nowrap; }
.sub { font-size: 29px; line-height: 1.3; color: var(--ink-2); margin: 12px 0 0; }
.term { position: relative; background: var(--term-bg); color: var(--term-fg); margin-top: 42px; border: 1px solid var(--divider); }
.term .corner { color: #75777a; }
.bar { display: flex; justify-content: space-between; padding: 10px 22px; border-bottom: 1px solid var(--term-rule); font: 400 17px/1.2 "JetBrains Mono", monospace; color: var(--term-dim); }
table { width: 100%; border-collapse: collapse; font: 400 22px/1 "JetBrains Mono", monospace; }
th, td { text-align: left; padding: 11px 22px; white-space: nowrap; }
th { font-weight: 400; color: var(--term-dim); border-bottom: 1px solid var(--term-rule); padding-top: 12px; }
tr + tr td { border-top: 1px solid var(--term-rule); }
td.n { text-align: right; width: 60px; }
.hi { color: var(--term-hi); } .ox { color: var(--term-ox); } .dim { color: var(--term-dim); }
</style>
</head>
<body>
<div class="frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i></div>
<div class="content">
  <div class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 22 22" aria-hidden="true"><rect x="0.75" y="0.75" width="20.5" height="20.5" fill="none" stroke="#1d1f20" stroke-width="1.5"/><circle cx="11" cy="11" r="5.5" fill="none" stroke="#1d1f20" stroke-width="1.5"/><circle cx="15" cy="7" r="2.4" fill="#a6552d"/></svg>
      <span class="brand-word">oxide<span>pm</span></span>
    </div>
    <span class="url">oxidepm.com</span>
  </div>
  <h1>A process manager written in Rust</h1>
  <p class="sub">Keeps your apps running on Linux. Open source, MIT or Apache-2.0.</p>
  <div class="term">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <div class="bar"><span>deploy@srv-01:~</span><span>oxidepm status</span></div>
<table>
      <thead><tr><th>id</th><th>name</th><th>mode</th><th>restarts</th><th>status</th><th>uptime</th></tr></thead>
      <tbody>
      <tr><td>1</td><td>db</td><td>cmd</td><td>0</td><td class="hi">online</td><td>11s</td></tr>
      <tr><td>2</td><td>api</td><td>cmd</td><td>0</td><td class="hi">online</td><td>11s</td></tr>
      <tr><td>3</td><td>web</td><td>cmd</td><td>0</td><td class="hi">online</td><td>6s</td></tr>
      <tr><td>4</td><td>worker</td><td>cmd</td><td>2</td><td class="hi">online</td><td>10s</td></tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
