title: Not found — OxidePM
description: There is nothing at this address.
path: /404.html
out: 404.html
robots: noindex
---
<main id="main" class="wrap nf">
  <span class="kicker">Error 404</span>
  <div class="rule"></div>
  <h1 class="display display-404">Page not found</h1>
  <p class="nf-lede">There is nothing at this address. It may have moved when the docs were reorganised.</p>

  <figure class="blueprint term">
    <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
    <pre class="term-body wrap"><span class="t-hi">$</span> oxidepm show <span data-path>/missing-page</span>
<span class="t-ox">✗</span> App not found: <span data-path>/missing-page</span>
<span class="t-ox">Error:</span> App not found: <span data-path>/missing-page</span>
<span class="t-dim">try: the home page, the docs, or the adapters list</span></pre>
  </figure>

  <ul class="nf-links">
    <li><a href="/" class="btn btn-primary btn-md blueprint"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>Home</a></li>
    <li><a href="/docs/" class="btn btn-secondary btn-sm">Docs</a></li>
    <li><a href="/adapters/" class="btn btn-secondary btn-sm">Adapters</a></li>
    <li><a href="https://github.com/oxidekit/oxidepm/issues" class="btn btn-ghost btn-sm">Report a broken link</a></li>
  </ul>
</main>
